# SPDX-License-Identifier: MIT
# Network policy preset for the marketing-bot sandbox.
# Apply with: nemoclaw <name> policy-add marketing-bot

preset:
  name: marketing-bot
  description: "Egress for NVIDIA/DeepSeek inference, LinkedIn/X/Instagram/Bluesky publishing APIs, RSS hosts, and the perttulagamestudio.com devlog"

network_policies:
  nvidia-inference:
    name: nvidia-inference
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/v1/**" }
          - allow: { method: GET,  path: "/v1/**" }
    binaries:
      - { path: /usr/local/lib/nemo-marketing-bot/.venv/bin/python }
      - { path: /usr/local/lib/nemo-marketing-bot/.venv/bin/python3 }
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }

  deepseek-inference:
    name: deepseek-inference
    endpoints:
      - host: api.deepseek.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/chat/completions" }
          - allow: { method: GET,  path: "/models" }
          - allow: { method: POST, path: "/v1/chat/completions" }
          - allow: { method: GET,  path: "/v1/models" }
    binaries:
      - { path: /usr/local/lib/nemo-marketing-bot/.venv/bin/python }
      - { path: /usr/local/lib/nemo-marketing-bot/.venv/bin/python3 }
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }

  linkedin:
    name: linkedin
    endpoints:
      - host: api.linkedin.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/v2/ugcPosts" }
          - allow: { method: POST, path: "/rest/posts" }
          - allow: { method: GET,  path: "/v2/me" }
          - allow: { method: POST, path: "/v2/assets**" }
      - host: www.linkedin.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/oauth/v2/accessToken" }

  x-api:
    name: x-api
    endpoints:
      - host: api.x.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/2/tweets" }
          - allow: { method: GET,  path: "/2/tweets/**" }
          - allow: { method: GET,  path: "/2/users/me" }
      - host: api.twitter.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/2/tweets" }
          - allow: { method: GET,  path: "/2/tweets/**" }
      - host: upload.twitter.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/1.1/media/upload.json" }

  instagram-graph:
    name: instagram-graph
    endpoints:
      - host: graph.facebook.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/v*/**/media" }
          - allow: { method: POST, path: "/v*/**/media_publish" }
          - allow: { method: GET,  path: "/v*/**" }

  rss-feeds:
    name: rss-feeds
    endpoints:
      - host: blogs.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: feeds.feedburner.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: perttulagamestudio.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: www.perttulagamestudio.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }

  bluesky:
    name: bluesky
    endpoints:
      - host: bsky.social
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/xrpc/com.atproto.server.createSession" }
          - allow: { method: POST, path: "/xrpc/com.atproto.server.refreshSession" }
          - allow: { method: POST, path: "/xrpc/com.atproto.repo.createRecord" }
          - allow: { method: POST, path: "/xrpc/com.atproto.repo.uploadBlob" }
          - allow: { method: GET,  path: "/xrpc/**" }
    binaries:
      - { path: /usr/local/lib/nemo-marketing-bot/.venv/bin/python }
      - { path: /usr/local/lib/nemo-marketing-bot/.venv/bin/python3 }
      - { path: /usr/local/lib/nemo-marketing-bot/.venv/bin/nemo-bot }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }

  devlog-direct:
    name: devlog-direct
    endpoints:
      - host: perttulagamestudio.com
        port: 443
        access: full
      - host: www.perttulagamestudio.com
        port: 443
        access: full
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }
