[project]
name = "nemo-marketing-bot"
version = "0.1.0"
description = "Game marketing bot powered by NVIDIA Nemotron that drafts channel content, plans creator outreach, schedules campaigns and publishes supported social posts."
requires-python = ">=3.11"
dependencies = [
    "openai==1.54.4",
    "httpx==0.27.2",
    "feedparser==6.0.11",
    "apscheduler==3.10.4",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "tweepy==4.14.0",
    "typer==0.12.5",
    "click<8.2",
    "rich==13.9.4",
    "python-dotenv==1.0.1",
    "tenacity==9.0.0",
    "PyYAML==6.0.2",
    "python-telegram-bot==21.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[project.scripts]
nemo-bot = "nemo_marketing_bot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
